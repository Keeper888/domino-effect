<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Gift Giver</title>
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-auth-page="true">
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-header">
                <a href="../../index.html" class="auth-logo">
                    <img src="../../assets/logo.png" alt="Gift Giver" class="auth-logo-icon">
                    <span class="auth-logo-text">Gift Giver</span>
                </a>
                <h1 class="auth-title">Create your account</h1>
                <p class="auth-subtitle">Start finding perfect gifts today</p>
            </div>

            <div class="auth-card">
                <form class="auth-form" id="signupForm">
                    <div class="form-group">
                        <label class="form-label" for="name">Full Name</label>
                        <div class="form-input-icon">
                            <span class="input-icon">👤</span>
                            <input
                                type="text"
                                id="name"
                                class="form-input"
                                placeholder="Enter your name"
                                required
                                autocomplete="name"
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <div class="form-input-icon">
                            <span class="input-icon">📧</span>
                            <input
                                type="email"
                                id="email"
                                class="form-input"
                                placeholder="you@example.com"
                                required
                                autocomplete="email"
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="form-input-icon">
                            <span class="input-icon">🔒</span>
                            <input
                                type="password"
                                id="password"
                                class="form-input"
                                placeholder="Create a password"
                                required
                                autocomplete="new-password"
                                minlength="6"
                            >
                        </div>
                        <div class="password-strength" id="passwordStrength" style="display: none;">
                            <div class="strength-bar">
                                <div class="strength-segment" id="seg1"></div>
                                <div class="strength-segment" id="seg2"></div>
                                <div class="strength-segment" id="seg3"></div>
                                <div class="strength-segment" id="seg4"></div>
                            </div>
                            <span class="strength-text" id="strengthText">Password strength</span>
                        </div>
                    </div>

                    <div class="auth-checkbox">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">
                            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">Create Account</button>
                </form>

                <div class="auth-divider">or continue with</div>

                <div class="auth-social">
                    <button type="button" class="auth-social-btn">
                        <span class="social-icon">🔵</span>
                        Continue with Google
                    </button>
                </div>
            </div>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Log in</a></p>
            </div>
        </div>
    </div>

    <script src="../../js/storage.js"></script>
    <script src="../../js/common.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/dev-nav.js"></script>
</body>
</html>
