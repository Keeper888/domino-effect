<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Gift Giver</title>
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-auth-page="true">
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-header">
                <a href="../../index.html" class="auth-logo">
                    <img src="../../assets/logo.png" alt="Gift Giver" class="auth-logo-icon">
                    <span class="auth-logo-text">Gift Giver</span>
                </a>
                <h1 class="auth-title">Welcome back!</h1>
                <p class="auth-subtitle">Log in to continue finding perfect gifts</p>
            </div>

            <div class="auth-card">
                <form class="auth-form" id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <div class="form-input-icon">
                            <span class="input-icon">📧</span>
                            <input
                                type="email"
                                id="email"
                                class="form-input"
                                placeholder="you@example.com"
                                required
                                autocomplete="email"
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="form-input-icon">
                            <span class="input-icon">🔒</span>
                            <input
                                type="password"
                                id="password"
                                class="form-input"
                                placeholder="Enter your password"
                                required
                                autocomplete="current-password"
                            >
                        </div>
                        <div class="forgot-password">
                            <a href="#">Forgot password?</a>
                        </div>
                    </div>

                    <div class="auth-checkbox">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me for 30 days</label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">Log In</button>
                </form>

                <div class="auth-divider">or continue with</div>

                <div class="auth-social">
                    <button type="button" class="auth-social-btn">
                        <span class="social-icon">🔵</span>
                        Continue with Google
                    </button>
                </div>
            </div>

            <div class="auth-footer">
                <p>Don't have an account? <a href="signup.html">Sign up</a></p>
            </div>
        </div>
    </div>

    <script src="../../js/storage.js"></script>
    <script src="../../js/common.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/dev-nav.js"></script>
</body>
</html>
