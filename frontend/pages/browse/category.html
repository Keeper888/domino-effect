<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category - Gift Giver</title>
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/browse.css">
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="browse-page">
    <!-- Navigation -->
    <nav class="navbar-auth">
        <a href="../../index.html" class="logo">
            <img src="../../assets/logo.png" alt="Gift Giver" class="logo-icon">
            <span class="logo-text">Gift Giver</span>
        </a>
        <ul class="nav-links">
            <li><a href="../dashboard.html" class="nav-link">Dashboard</a></li>
            <li><a href="../persona/list.html" class="nav-link">My Personas</a></li>
            <li><a href="../calendar.html" class="nav-link">Calendar</a></li>
            <li><a href="index.html" class="nav-link active">Browse</a></li>
        </ul>
        <div class="user-menu">
            <div class="user-dropdown">
                <div class="user-avatar">??</div>
                <div class="dropdown-menu">
                    <span class="dropdown-item" data-user-name>User</span>
                    <div class="dropdown-divider"></div>
                    <a href="../saved/index.html" class="dropdown-item">Saved Results</a>
                    <a href="#" class="dropdown-item">Settings</a>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item" data-action="logout">Log Out</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="page-container">
        <!-- Header -->
        <div class="category-page-header">
            <a href="index.html" class="category-page-back">
                <span>←</span> Back to Browse
            </a>
            <div class="category-page-title">
                <span class="category-page-icon" id="categoryIcon">🎁</span>
                <h1 class="category-page-name" id="categoryName">Category</h1>
            </div>
        </div>

        <!-- Filters -->
        <div class="browse-filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="under25">Under $25</button>
            <button class="filter-btn" data-filter="25-50">$25 - $50</button>
            <button class="filter-btn" data-filter="50-100">$50 - $100</button>
            <button class="filter-btn" data-filter="100plus">$100+</button>
        </div>

        <!-- Products Grid -->
        <div class="products-grid" id="productsGrid">
            <!-- Will be populated by JS -->
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- App Scripts -->
    <script src="../../js/config.js"></script>
    <script src="../../js/supabase.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/common.js"></script>
    <script>
        const categories = {
            her: { name: 'For Her', icon: '👩' },
            him: { name: 'For Him', icon: '👨' },
            kids: { name: 'For Kids', icon: '👶' },
            home: { name: 'For Home', icon: '🏠' },
            tech: { name: 'Tech Gadgets', icon: '💻' },
            experiences: { name: 'Experiences', icon: '🎟️' },
            selfcare: { name: 'Self-Care', icon: '🧴' },
            food: { name: 'Food & Treats', icon: '🍫' },
            trending: { name: 'Trending', icon: '🔥' },
            budget: { name: 'Budget-Friendly', icon: '💰' }
        };

        const allProducts = [
            { id: 1, title: 'Wireless Earbuds Pro', price: 79, category: 'tech' },
            { id: 2, title: 'Luxury Spa Set', price: 65, category: 'selfcare' },
            { id: 3, title: 'Smart Watch Band', price: 45, category: 'tech' },
            { id: 4, title: 'Gourmet Chocolate Box', price: 35, category: 'food' },
            { id: 5, title: 'Scented Candle Set', price: 28, category: 'home' },
            { id: 6, title: 'Cozy Throw Blanket', price: 35, category: 'home' },
            { id: 7, title: 'Journal & Pen Set', price: 22, category: 'her' },
            { id: 8, title: 'Plant Starter Kit', price: 30, category: 'home' },
            { id: 9, title: 'Leather Wallet', price: 55, category: 'him' },
            { id: 10, title: 'Makeup Brush Set', price: 40, category: 'her' },
            { id: 11, title: 'Gaming Headset', price: 89, category: 'tech' },
            { id: 12, title: 'Kids Art Kit', price: 25, category: 'kids' },
            { id: 13, title: 'Yoga Mat Set', price: 58, category: 'selfcare' },
            { id: 14, title: 'Wine Glass Set', price: 42, category: 'home' },
            { id: 15, title: 'Bluetooth Speaker', price: 65, category: 'tech' },
            { id: 16, title: 'Cooking Class Voucher', price: 120, category: 'experiences' }
        ];

        let currentFilter = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const cat = params.get('cat') || 'trending';

            const category = categories[cat] || categories.trending;
            document.getElementById('categoryIcon').textContent = category.icon;
            document.getElementById('categoryName').textContent = category.name;
            document.title = `${category.name} - Gift Giver`;

            loadProducts(cat);
            initFilters();
        });

        function loadProducts(categoryKey) {
            const grid = document.getElementById('productsGrid');

            let products = allProducts;

            // Filter by category
            if (categoryKey !== 'trending' && categoryKey !== 'budget') {
                products = allProducts.filter(p =>
                    p.category === categoryKey ||
                    (categoryKey === 'her' && ['selfcare', 'her'].includes(p.category)) ||
                    (categoryKey === 'him' && ['tech', 'him'].includes(p.category))
                );
            }

            if (categoryKey === 'budget') {
                products = allProducts.filter(p => p.price < 50);
            }

            // Apply price filter
            if (currentFilter !== 'all') {
                products = products.filter(p => {
                    switch (currentFilter) {
                        case 'under25': return p.price < 25;
                        case '25-50': return p.price >= 25 && p.price < 50;
                        case '50-100': return p.price >= 50 && p.price < 100;
                        case '100plus': return p.price >= 100;
                        default: return true;
                    }
                });
            }

            if (products.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-icon">🔍</div>
                        <h3 class="empty-title">No products found</h3>
                        <p class="empty-text">Try adjusting your filters</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="https://via.placeholder.com/280x180/e3f2fd/1976d2?text=${encodeURIComponent(p.title)}"
                         alt="${p.title}" class="product-image">
                    <div class="product-content">
                        <div class="product-price">$${p.price}</div>
                        <div class="product-title">${p.title}</div>
                        <div class="product-category">${capitalizeFirst(p.category)}</div>
                        <button class="btn btn-orange btn-sm btn-full">View Details</button>
                    </div>
                </div>
            `).join('');
        }

        function initFilters() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;

                    const params = new URLSearchParams(window.location.search);
                    loadProducts(params.get('cat') || 'trending');
                });
            });
        }

        function capitalizeFirst(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }
    </script>
    <script src="../../js/dev-nav.js"></script>
</body>
</html>
