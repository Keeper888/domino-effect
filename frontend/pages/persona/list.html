<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personas - Gift Giver</title>
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/persona.css">
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="persona-page" data-requires-auth="true">
    <!-- Navigation -->
    <nav class="navbar-auth">
        <a href="../../index.html" class="logo">
            <img src="../../assets/logo.png" alt="Gift Giver" class="logo-icon">
            <span class="logo-text">Gift Giver</span>
        </a>
        <ul class="nav-links">
            <li><a href="../dashboard.html" class="nav-link">Dashboard</a></li>
            <li><a href="list.html" class="nav-link active">My Personas</a></li>
            <li><a href="../calendar.html" class="nav-link">Calendar</a></li>
            <li><a href="../browse/index.html" class="nav-link">Browse</a></li>
        </ul>
        <div class="user-menu">
            <div class="user-dropdown">
                <div class="user-avatar">??</div>
                <div class="dropdown-menu">
                    <span class="dropdown-item" data-user-name>User</span>
                    <div class="dropdown-divider"></div>
                    <a href="../saved/index.html" class="dropdown-item">Saved Results</a>
                    <a href="#" class="dropdown-item">Settings</a>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item" data-action="logout">Log Out</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="page-container">
        <!-- Header -->
        <div class="persona-header">
            <h1>My Personas</h1>
            <a href="../quiz.html" class="btn btn-primary btn-md">
                + Create New
            </a>
        </div>

        <!-- Persona Grid -->
        <div class="persona-grid" id="personaGrid">
            <!-- Personas will be rendered here -->
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal-content">
            <div class="modal-icon">⚠️</div>
            <h3 class="modal-title">Delete Persona?</h3>
            <p class="modal-text">This will permanently remove <strong id="deletePersonaName"></strong> and all related session history.</p>
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeDeleteModal()">Cancel</button>
                <button class="modal-btn danger" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- App Scripts -->
    <script src="../../js/config.js"></script>
    <script src="../../js/supabase.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/common.js"></script>
    <script src="../../js/persona.js"></script>
    <script src="../../js/dev-nav.js"></script>
</body>
</html>
